[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# Host canonicalisation — www → apex, 301.
# Both hosts were serving 200 (verified live), which splits every page into two
# crawlable URLs. The self-referencing <link rel="canonical"> on www already
# points at the apex, so Google was consolidating them, but a canonical is a
# hint and a 301 is an instruction — and the AI retrieval crawlers that do not
# render JavaScript are much less careful about following hints.
# Must stay ABOVE every path-based rule below: a full-URL `from` matches on
# host, so it only fires for www and never touches apex traffic.
[[redirects]]
  from = "https://www.ghlindiaventures.com/*"
  to = "https://ghlindiaventures.com/:splat"
  status = 301
  force = true

# /feed.xml — the conventional feed path. The real document is emitted by the
# static export at /blog/rss.xml; this serves it at the expected path too
# (status 200 = rewrite, not a redirect, so both paths return the feed
# directly). Keep it above the catch-all /* → /404.html below.
[[redirects]]
  from = "/feed.xml"
  to = "/blog/rss.xml"
  status = 200

# API proxy alias — Netlify Functions live at /.netlify/functions/<name> by
# default. Several client modules (admin/staff/client claudeApi, chatKnowledge,
# VoiceCompanion) call the shorter /api/<name> path. Without this rewrite the
# catch-all /* → /404.html below intercepts them, returning a 404 HTML page
# that the client surfaces as "All models failed. Last error: Model X not
# found". Keep this redirect ABOVE the catch-all.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Financial IQ dynamic slugs — any /financial-iq/<slug> path that doesn't
# have a pre-built static file (e.g. articles created since the last
# deploy) falls back to the "What Is an AIF" shell. Its DynamicFIQViewer
# reads the slug from window.location.pathname and loads the correct
# post from Supabase, so new articles work immediately without a
# rebuild. force=false means existing static files (/financial-iq/ and
# known-slug folders) are served first.
[[redirects]]
  from = "/financial-iq/*"
  to = "/financial-iq/what-is-aif/index.html"
  status = 200
  force = false

# Blog dynamic slugs — same pattern as financial-iq above. Any
# /blog/<slug> created in Supabase after the last deploy has no
# static page, so without this rule the catch-all below 404s it.
# The /blog-post shell reads window.location.pathname, derives the
# slug, and renders DynamicBlogViewer. force=false so pre-built
# slugs continue to serve their static HTML.
[[redirects]]
  from = "/blog/*"
  to = "/blog-post/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.elfsight.com https://elfsightcdn.com https://core.service.elfsight.com https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com https://fonts.googleapis.com https://static.elfsight.com; font-src 'self' https://fonts.cdnfonts.com https://fonts.gstatic.com https://static.elfsight.com data:; img-src 'self' data: blob: https: *.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://api.anthropic.com https://api.resend.com https://www.google-analytics.com https://api.monday.com https://api.sarvam.ai https://www.facebook.com https://connect.facebook.net; media-src 'self' https: data: blob:; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://youtube.com https://s.tradingview.com https://www.tradingview.com https://static.elfsight.com;"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/blog/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ───────────────────────────────────────────────────────────────────────────
# X-Robots-Tag: noindex on everything that must not appear in search.
#
# This is the half of the job robots.txt cannot do. robots.txt controls
# CRAWLING; a Disallow-ed URL can still be listed as a bare link because the
# crawler never fetches the page and so never sees a noindex. Serving the
# directive as a response header removes the URL from the index for certain.
#
# /login/ and /register/ are additionally allowed in robots.txt precisely so
# these headers get read. The gated consoles below stay Disallow-ed as well —
# belt and braces, since they are behind auth anyway.
# Each route needs both the bare and the splat form: "/login/*" alone does not
# reliably match "/login/" itself.
# ───────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/login/"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/login/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/register/"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/register/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/investor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/agent/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/contact/thankyou/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
